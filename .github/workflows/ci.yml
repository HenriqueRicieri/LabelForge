name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    # The socket tests have deadlines of their own, but a hung runner should not hold
    # the queue for the six-hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Warnings fail the run, NuGet audit advisories included. The few that were reviewed
      # and found unreachable are listed, one by one, in Directory.Build.props.
      - name: Restore
        run: dotnet restore -warnaserror

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Outside the solution, so nothing else would notice an API change breaking it.
      - name: Build benchmark
        run: dotnet build tools/LabelForge.Bench --configuration Release -warnaserror

      # The license gate that packaging runs, here too, so a dependency bump that brings
      # in an unreviewed package fails on the pull request rather than at release time.
      - name: Check third-party notices
        shell: pwsh
        run: |
          dotnet publish src/LabelForge.App -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-third-party-notices.ps1 -PublishDirectory artifacts/publish/win-x64

      - name: Check native QA bootstrap and storage isolation
        run: dotnet run --project tools/LabelForge.NativeQA --configuration Release -- --self-check

  ui-regression:
    name: UI (${{ matrix.scenario }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: designer-light
            arguments: designer synthetic
          - scenario: designer-dark
            arguments: designer dark synthetic
          - scenario: workspace-layout
            arguments: ui-layout
          - scenario: transform-gestures
            arguments: transform-gestures
          - scenario: cm-units
            arguments: cm-units
          - scenario: viewer-size
            arguments: viewer-size
          - scenario: viewer-layout
            arguments: viewer-layout
          - scenario: viewer-compare
            arguments: viewer-compare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build UI harness
        run: dotnet build tools/LabelForge.E2E --configuration Release -warnaserror

      - name: Run UI regression
        shell: pwsh
        run: |
          dotnet run --project tools/LabelForge.E2E --no-build --configuration Release -- ${{ matrix.arguments }} 2>&1 | Tee-Object -FilePath ui-checks.log
          exit $LASTEXITCODE

      - name: Keep failed UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.scenario }}
          path: |
            ui-checks.log
            tools/LabelForge.E2E/bin/Release/net10.0/**/*.png
          retention-days: 7
